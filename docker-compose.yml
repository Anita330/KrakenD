services:

  krakend:
    image: devopsfaith/krakend:2
    container_name: krakend
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    ports:
      - "8080:8080"
    volumes:
      - ./krakend.json:/etc/krakend/krakend.json:ro
    depends_on:
      - backend
      - keycloak
    networks:
      - krakend-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8081:80"
    networks:
      - krakend-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/krakend-sandbox-realm.json:/opt/keycloak/data/import/krakend-sandbox-realm.json:ro
    networks:
      - krakend-network

networks:
  krakend-network:
    driver: bridge
